<tui-root>
  <app-header />

  @if (isAccountPage) {
    <div class="bg-gray-50">
      <div class="container mx-auto px-4">
        <app-breadcrumbs />
      </div>
    </div>
  }

  <main class="main-content relative overflow-x-hidden">
    <div class="container mx-auto px-4" [class.pb-10]="!isHomePage">
      @if (!isServicesPage) {
        <h1 class="mt-10 inline-block text-4xl font-bold">
          {{ title$ | async }}
        </h1>
      }

      @if (description$ | async; as description) {
        <div class="mt-2 mb-10 max-w-[800px]">
          @if (Array.isArray(description)) {
            @for (paragraph of description; track $index) {
              <p class="text-md text-gray-800">{{ paragraph }}</p>
            }
          } @else {
            <p class="text-md text-gray-800">{{ description }}</p>
          }
        </div>
      }

      <router-outlet />
    </div>
  </main>
  <app-footer></app-footer>
</tui-root>
