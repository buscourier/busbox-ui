<tui-accordion>
  @for (item of navigationItems; track item.link) {
    @if (item.dropdown) {
      <button
        tuiAccordion
        class="w-full justify-between! rounded-none! border-b! border-gray-100! font-medium! text-gray-600! shadow-none! hover:bg-gray-50!"
      >
        <span>{{ item.name }}</span>
      </button>

      <tui-expand class="bg-gray-50 p-0! shadow-none">
        <div class="border-t border-gray-200 bg-gray-50">
          @for (subItem of item.dropdown; track subItem.link) {
            <a
              [routerLink]="'/' + subItem.link"
              (click)="onNavigate()"
              class="block py-3 pr-6 pl-6 text-sm text-gray-600 transition-colors duration-200 hover:bg-gray-100"
              routerLinkActive="bg-yellow-500/20 font-medium"
            >
              {{ subItem.name }}
            </a>
          }
        </div>
      </tui-expand>
    } @else {
      <div class="border-b border-gray-100 last:border-b-0">
        <a
          [routerLink]="'/' + item.link"
          (click)="onNavigate()"
          class="flex w-full px-6 py-4 font-medium text-gray-700 transition-colors duration-200 hover:bg-gray-50"
          routerLinkActive="bg-yellow-500/20 font-semibold"
        >
          {{ item.name }}
        </a>
      </div>
    }
  }
</tui-accordion>
