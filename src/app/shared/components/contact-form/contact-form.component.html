@let isSubmitting = isSubmitting$ | async;

<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <div [class]="layoutClass">
    <label tuiLabel>
      <span class="block text-sm text-gray-800">Имя</span>
      <tui-textfield>
        <input
          tuiTextfield
          [formControl]="userName"
          [tuiHint]="[] | tuiFieldErrorContent"
          [placeholder]="'user.placeholders.lastName' | transloco"
          tuiHintAppearance="error"
        />
      </tui-textfield>
    </label>
    <div tuiLabel>
      <span class="block text-sm text-gray-800">
        {{ 'contacts.labels.phone' | transloco }}
      </span>

      <tui-textfield>
        <input
          autocomplete="tel"
          mask="+7 ### ###-##-##"
          tuiInputPhone
          [attr.pattern]="pattern"
          [formControl]="phone"
          tuiHintAppearance="error"
          [tuiHint]="[] | tuiFieldErrorContent"
          [placeholder]="'contacts.placeholders.phone' | transloco"
        />
      </tui-textfield>
    </div>
    <label tuiLabel [class]="emailFieldClass">
      <span class="block text-sm text-gray-800">
        {{ 'contacts.labels.email' | transloco }}
      </span>
      <div class="relative">
        <tui-textfield>
          <input
            tuiTextfield
            [formControl]="email"
            [tuiHint]="[] | tuiFieldErrorContent"
            [placeholder]="'contacts.placeholders.email' | transloco"
            tuiHintAppearance="error"
          />
        </tui-textfield>
      </div>
    </label>
    <div tuiLabel [class]="commentFieldClass">
      <span class="text-sm text-gray-800">
        {{ isCustomTasks ? 'Комментарий к заявке' : 'Ваш вопрос' }}
      </span>
      <tui-textfield [style.margin-block-end.rem]="1">
        <textarea tuiTextarea [formControl]="message" [limit]="100" [max]="6" [min]="3"></textarea>
      </tui-textfield>
    </div>
    <label [class]="processingFieldClass">
      <input tuiCheckbox type="checkbox" [formControl]="processingAccepted" />
      <span class="text-sm text-gray-800">
        Нажимая кнопку «Отправить», я даю свое согласие на обработку персональных данных
      </span>
    </label>

    <button
      type="submit"
      tuiButton
      appearance="accent"
      [disabled]="this.form.invalid || isSubmitting"
      [loading]="isSubmitting"
      class="mt-4"
    >
      Отправить
    </button>
  </div>
</form>
