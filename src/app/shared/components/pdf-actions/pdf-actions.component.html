<div class="flex gap-2">
  <button
    tuiButton
    appearance="primary"
    size="s"
    (click)="print.emit(content)"
    [disabled]="!content"
  >
    <tui-icon icon="@tui.printer" class="mr-1"></tui-icon>
    {{ printLabel }}
  </button>

  <button
    tuiButton
    appearance="primary"
    size="s"
    (click)="download.emit(content)"
    [disabled]="!content"
  >
    <tui-icon icon="@tui.download" class="mr-1"></tui-icon>
    {{ downloadLabel }}
  </button>
</div>
