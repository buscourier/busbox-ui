<header class="bg-white border-b border-gray-200 sticky top-0 z-50">
  <div class="container mx-auto px-4">
    <div class="flex items-center justify-between h-16 gap-4">
      <!-- Mobile Menu Button -->
      <button
        class="flex flex-col justify-center items-center w-8 h-8 bg-transparent border-0 cursor-pointer p-0 gap-0.5 transition-all duration-300 md:hidden"
        (click)="toggleMobileMenu()"
        aria-label="Открыть меню"
      >
        <span
          class="block w-5 h-0.5 bg-gray-700 transition-all duration-300 origin-center"
          [class]="isMobileMenuOpen ? 'translate-x-1.5 translate-y-1.5 rotate-45' : ''"
        ></span>
        <span
          class="block w-5 h-0.5 bg-gray-700 transition-all duration-300 origin-center"
          [class]="isMobileMenuOpen ? 'opacity-0' : ''"
        ></span>
        <span
          class="block w-5 h-0.5 bg-gray-700 transition-all duration-300 origin-center"
          [class]="isMobileMenuOpen ? 'translate-x-1.5 -translate-y-1.5 -rotate-45' : ''"
        ></span>
      </button>

      <!-- Logo -->
      <div class="flex-1 flex justify-center md:flex-none md:justify-start">
        <a routerLink="/" class="flex items-center no-underline">
          <img src="/assets/logo.svg" alt="Баскурьер" class="h-8 w-auto" />
        </a>
      </div>

      <!-- Desktop Navigation -->
      <div class="flex-1 flex justify-center hidden md:block">
        <app-navigation />
      </div>

      <!-- Right Section -->
      <div class="flex items-center gap-4">
        <!-- Contact Phone -->
        <a
          [href]="'tel:' + getContactPhone()"
          class="flex items-center gap-2 no-underline text-gray-700 font-medium transition-colors duration-200 hover:text-amber-500 hidden sm:flex"
        >
          <span class="text-lg">📞</span>
          <span class="text-sm whitespace-nowrap">{{ getContactPhone() }}</span>
        </a>

        <!-- User Menu -->
        <div class="relative">
          <button
            class="flex items-center justify-center w-10 h-10 bg-amber-400 border-0 rounded-full cursor-pointer transition-all duration-200 shadow-md hover:bg-amber-500 hover:-translate-y-0.5 hover:shadow-lg"
            [class.bg-amber-500]="isUserMenuOpen"
            (click)="toggleUserMenu()"
            aria-label="Меню пользователя"
          >
            <span class="text-lg text-white">👤</span>
          </button>

          <!-- User Dropdown -->
          @if (isUserMenuOpen) {
            <div
              class="absolute top-[calc(100%+0.5rem)] right-0 bg-white border border-gray-200 rounded-lg shadow-xl min-w-[200px] z-50 overflow-hidden animate-in fade-in slide-in-from-top-2 duration-200"
            >
              @for (item of getUserMenuItems(); track item.link) {
                <a
                  [routerLink]="'/' + item.link"
                  class="block w-full px-4 py-3 no-underline text-gray-700 font-medium transition-colors duration-200 border-b border-gray-100 hover:bg-gray-50 hover:text-amber-500"
                  (click)="closeUserMenu()"
                >
                  {{ item.name }}
                </a>
              }
              <button
                class="block w-full px-4 py-3 text-red-500 font-medium transition-colors duration-200 border-0 bg-transparent text-left cursor-pointer hover:bg-red-50 hover:text-red-600"
                (click)="logout()"
              >
                Выйти
              </button>
            </div>
          }
        </div>
      </div>
    </div>
  </div>
</header>

<!-- Mobile Menu -->
@if (isMobileMenuOpen) {
  <app-mobile-menu [isOpen]="isMobileMenuOpen" (close)="closeMobileMenu()" />
}
