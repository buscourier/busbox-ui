@let breadcrumbs = breadcrumbs$ | async;

@if (breadcrumbs && breadcrumbs.length > 1) {
  <tui-breadcrumbs size="l" class="tui-space_top-2 pt-4 mb-10">
    @for (item of breadcrumbs$ | async; track item.routerLink; let isLast = $last) {
      <ng-container *tuiItem>
        @if (!isLast) {
          <a
            tuiLink
            [routerLink]="item.routerLink"
            [class.disabled]="item.disabled"
            class="flex items-center gap-1"
          >
            @if (item.icon) {
              <!--            <tui-icon [icon]="item.icon" class="text-sm"></tui-icon>-->
              icon
            }
            {{ item.caption }}
          </a>
        } @else {
          <span class="flex items-center gap-1 text-gray-600">
            @if (item.icon) {
              <!--                <tui-icon [icon]="item.icon" class="text-sm"></tui-icon>-->
              icon
            }
            {{ item.caption }}
          </span>
        }
      </ng-container>
    }
  </tui-breadcrumbs>
}
