<form [class]="getFormClasses()" (ngSubmit)="onSubmit()">
  <b class="mb-6 block text-2xl leading-7 font-bold lg:text-2xl">Рассчитайте стоимость</b>
  <label tuiLabel class="mb-4">
    <span class="mb-1 block text-sm text-gray-700">Город отправления</span>
    <tui-textfield
      tuiChevron
      tuiDropdownMobile="Выберите город отправления"
      [stringify]="'name' | tuiStringify"
      [tuiTextfieldCleaner]="false"
    >
      <input tuiSelect placeholder="Выберите город" [formControl]="pickupCity" />
      <tui-data-list-wrapper
        *tuiTextfieldDropdown
        new
        [items]="pickupCities$ | async"
        [itemContent]="'name' | tuiStringify | tuiStringifyContent"
      />
    </tui-textfield>
  </label>
  <label tuiLabel class="mb-6">
    <span class="mb-1 block text-sm text-gray-700">Город получения</span>
    <tui-textfield
      tuiChevron
      tuiDropdownMobile="Выберите город получения"
      [stringify]="'name' | tuiStringify"
      [tuiTextfieldCleaner]="false"
    >
      <input tuiSelect placeholder="Выберите город" [formControl]="deliveryCity" />
      <tui-data-list-wrapper
        *tuiTextfieldDropdown
        new
        [items]="deliveryCities$ | async"
        [itemContent]="'name' | tuiStringify | tuiStringifyContent"
      />
    </tui-textfield>
  </label>

  <button type="submit" tuiButton appearance="accent" class="w-full" [loading]="true">
    Рассчитать
  </button>
</form>
