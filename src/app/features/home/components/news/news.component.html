@let lastNews = lastNews$ | async;

@if (lastNews && lastNews.length > 0) {
  <app-carousel
    appearance="secondary"
    pagination="top"
    [items]="lastNews"
    [itemTemplate]="slideTemplate"
  />
} @else {
  <div class="grid grid-cols-1 gap-8 md:grid-cols-2 lg:grid-cols-3">
    <div class="h-[393px] w-[395px] rounded-xl bg-black/5"></div>
    <div class="h-[393px] w-[395px] rounded-xl bg-black/5"></div>
    <div class="h-[393px] w-[395px] rounded-xl bg-black/10"></div>
  </div>
}
<div class="mt-12 text-center">
  @if (lastNews?.length) {
    <button
      type="button"
      tuiButton
      iconEnd="@tui.move-right"
      appearance="accent"
      size="l"
      class="w-xs"
      routerLink="/news"
    >
      Все новости
    </button>
  }
</div>

<ng-template #slideTemplate let-article>
  <app-news-card [article]="article" />
</ng-template>
