@let lastNews = lastNews$ | async;

<div class="bg-gray-50 p-4 px-7 transition-all group-hover:px-20">
  @if (lastNews && lastNews.length > 0) {
    <app-carousel
      appearance="secondary"
      pagination="top"
      [items]="lastNews"
      [itemTemplate]="slideTemplate"
    />
  }
</div>
