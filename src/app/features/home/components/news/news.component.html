@let lastNews = lastNews$ | async;

<div class="h-56 bg-gray-50 p-4 transition-all lg:px-7 lg:group-hover:px-20">
  @if (lastNews && lastNews.length > 0) {
    <div class="mx-auto">
      <app-carousel
        appearance="secondary"
        pagination="top"
        [items]="lastNews"
        [itemTemplate]="slideTemplate"
      />
    </div>
  }
</div>
