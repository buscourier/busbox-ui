@for (client of clients; track client.name) {
  <a
    [href]="client.link"
    target="_blank"
    class="flex h-24 items-center justify-center rounded-sm border border-transparent bg-white shadow-xl hover:border-yellow-500 hover:shadow-none lg:h-[153px]"
  >
    <tui-icon [icon]="client.name" [style.font-size.rem]="10" />
  </a>
}
