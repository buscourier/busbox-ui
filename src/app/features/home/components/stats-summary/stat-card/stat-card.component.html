<b
  class="flex size-24 flex-shrink-0 items-center justify-center rounded-full bg-yellow-500 text-4xl"
>
  {{ cities ? cities.length : count }}
</b>
<div class="flex flex-col">
  <p class="mb-3 lg:text-md" [innerHTML]="title"></p>
  <button type="button" class="text-left" (click)="onShowCities()">
    @if (text) {
      <tui-icon icon="help" [style.font-size.rem]="1.75" class="mr-2" />
      <span class="border-b border-dotted text-sm text-gray-400">{{ text }}</span>
    }
  </button>
</div>
