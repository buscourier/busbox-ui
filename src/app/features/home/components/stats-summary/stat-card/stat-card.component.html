<b
  class="flex size-24 flex-shrink-0 items-center justify-center rounded-full bg-yellow-500 text-4xl"
>
  {{ cities ? cities.length : count }}
</b>
<div class="flex flex-col">
  <p class="lg:text-md mb-3" [innerHTML]="title"></p>
  <button
    type="button"
    class="flex cursor-pointer gap-1 text-left focus:outline-0"
    (click)="onShowCities()"
  >
    @if (text) {
      <img src="/assets/icons/help.svg" class="mr-2" alt="Список городов" />
      <span class="border-b border-dotted text-sm text-gray-400 hover:text-gray-600">
        {{ text }}
      </span>
    }
  </button>
</div>
