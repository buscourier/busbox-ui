<app-page-layout [showBreadcrumbs]="true">
  <div class="flex flex-col md:flex-row md:space-x-10 lg:space-x-13">
    <main class="order-2 flex-grow md:order-1">
      @for (item of accountLinks; track item.link) {
        <div
          [routerLink]="'/' + item.link"
          class="hover:border-yellow mb-2 flex border border-gray-200 px-4 py-4 hover:cursor-pointer sm:space-x-13 sm:px-6 sm:py-9 md:space-x-0 md:rounded-sm md:border-x md:px-8 lg:space-x-13 lg:pr-10 lg:pl-13"
        >
          <div class="hidden sm:block md:hidden lg:block">
            <tui-icon
              class="mr-2"
              [icon]="item.icon || ''"
              [style.color]="'var(--color-gray-300)'"
              [style.font-size.rem]="5"
            />
          </div>
          <div class="flex basis-full flex-col justify-center">
            <h2 class="font-roboto mb-2 text-xl font-bold">{{ item.name }}</h2>
            <p class="mb-0">{{ item?.page?.description }}</p>
          </div>
          <div class="hidden items-center sm:flex">
            <tui-icon
              icon="@tui.chevron-right"
              [style.color]="'var(--color-gray-300)'"
              [style.font-size.rem]="4"
            />
          </div>
        </div>
      }
    </main>
    <!-- aside-->
    <aside class="order-1 mb-8 flex flex-shrink-0 flex-col items-start px-4 md:mb-0 md:px-0">
      <app-balance></app-balance>
      <button
        tuiButton
        type="button"
        class="mt-7 mb-4 w-full max-w-[275px]!"
        [routerLink]="bookingLink"
      >
        Оформить заказ
      </button>
      <button type="button" tuiButton appearance="flat" class="font-normal!" (click)="logout()">
        <span>Выйти из личного кабинета</span>
        <tui-icon
          icon="logout"
          class="rounded-full"
          [style.background]="'var(--color-yellow-500)'"
          [style.font-size.rem]="2"
        />
      </button>
    </aside>
  </div>
</app-page-layout>
