<div class="space-y-4">
  @for (link of infoLinks; track link.link) {
    <a
      [routerLink]="'/' + link.link"
      class="group flex items-start gap-4 p-4 rounded-lg border border-gray-200 hover:border-yellow-400 hover:bg-yellow-50 transition-all duration-200 no-underline"
    >
      @if (link.icon) {
        <span class="text-2xl flex-shrink-0 mt-1">{{ link.icon }}</span>
      }

      <div class="flex-1">
        <h3
          class="text-lg font-semibold text-gray-900 group-hover:text-yellow-600 transition-colors mb-1"
        >
          {{ link.name }}
        </h3>

        @if (link.description) {
          <!--          <p class="text-gray-600 text-sm leading-relaxed">-->
          <!--            {{ getShortDescription(link.description) }}-->
          <!--          </p>-->
        }
      </div>

      <div class="flex-shrink-0 mt-2">
        <svg
          class="w-5 h-5 text-gray-400 group-hover:text-yellow-500 transition-colors"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M9 5l7 7-7 7"
          ></path>
        </svg>
      </div>
    </a>
  }
</div>
