<div>
  <div class="px-6">
    <div class="mb-4 flex flex-wrap gap-x-6 gap-y-4">
      <app-info-item icon="point" class="mb-6">
        <p class="mb-0 leading-7 text-gray-400">Адрес:</p>
        <span>{{ office.address }}</span>
      </app-info-item>

      <app-info-item icon="alarm" class="mb-6">
        <p class="mb-0 leading-7 text-gray-400">График работы:</p>
        <span>{{ office.worktime }}</span>
      </app-info-item>

      <app-info-item icon="union" class="mb-6">
        <p class="mb-0 leading-7 text-gray-400">Контакты для связи:</p>
        <a tuiLink [href]="office.phone | contactLink: 'tel'">
          {{ office.phone }}
        </a>
      </app-info-item>

      <app-info-item icon="email" class="mb-6">
        <p class="mb-0 leading-7 text-gray-400">Почта отделения:</p>
        <a [href]="email | contactLink: 'email'" class="border-b border-dashed">
          {{ email }}
        </a>
      </app-info-item>
    </div>
    <div>
      <div class="mb-6">
        @if (office.video_url; as url) {
          <app-video class="max-w-[500px]" [src]="url" />
        } @else {
          <div class="relative h-60 w-full rounded-sm object-cover lg:h-48">
            <img
              [ngSrc]="'contacts-office-' + office.id + '.jpg'"
              [alt]="office.name"
              ngSrcset="360w, 420w, 640w, 720w, 840w, 1080w, 1280w, 1920w"
              sizes="(min-width: 640px) 360px, 100vw"
              fill
              class="rounded-sm bg-gray-50 object-cover text-gray-50"
            />
          </div>
        }
      </div>
    </div>
  </div>
</div>
