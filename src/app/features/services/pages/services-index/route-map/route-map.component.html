<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#fefefe" />

  <!-- Grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f8fafc" stroke-width="0.5" opacity="0.3" />
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#grid)" />

  <!-- MAIN DARK ROUTE LINE -->
  <path
    id="toKhabarovsk"
    d="M180 400 Q400 320 600 380 Q800 440 1000 360"
    stroke="#374151"
    stroke-width="5"
    fill="none"
    opacity="0.8"
  />

  <!-- Ветки (тоньше основной линии) -->
  <path
    id="toArtem"
    d="M180 400 Q240 380 300 350"
    stroke="#374151"
    stroke-width="2.5"
    fill="none"
    opacity="0.25"
  />
  <path
    id="toUssuriysk"
    d="M300 350 Q380 330 450 310"
    stroke="#374151"
    stroke-width="2.5"
    fill="none"
    opacity="0.25"
  />
  <path
    id="toDalnegorsk"
    d="M450 310 Q500 280 560 250"
    stroke="#374151"
    stroke-width="2.5"
    fill="none"
    opacity="0.25"
  />
  <path
    id="toPartizansk"
    d="M180 400 Q280 440 360 480"
    stroke="#374151"
    stroke-width="2.5"
    fill="none"
    opacity="0.25"
  />
  <path
    id="toNakhodka"
    d="M360 480 Q390 500 420 520"
    stroke="#374151"
    stroke-width="2.5"
    fill="none"
    opacity="0.25"
  />

  <!-- Новая южная ветка -->
  <path
    id="toBarabash"
    d="M180 400 Q160 460 200 520"
    stroke="#374151"
    stroke-width="2.5"
    fill="none"
    opacity="0.25"
  />
  <path
    id="toSlavyanka"
    d="M200 520 Q220 560 240 600"
    stroke="#374151"
    stroke-width="2.5"
    fill="none"
    opacity="0.25"
  />
  <path
    id="toAndreevka"
    d="M240 600 Q260 630 280 660"
    stroke="#374151"
    stroke-width="2.5"
    fill="none"
    opacity="0.25"
  />
  <path
    id="toHasan"
    d="M280 660 Q300 690 320 720"
    stroke="#374151"
    stroke-width="2.5"
    fill="none"
    opacity="0.25"
  />

  <!-- MOVING DOTS (остались без изменений) -->
  <circle r="6" fill="#ffdc00">
    <animateMotion dur="4s" repeatCount="indefinite">
      <mpath href="#toArtem" />
    </animateMotion>
  </circle>
  <circle r="6" fill="#ffdc00">
    <animateMotion dur="5s" repeatCount="indefinite" begin="0.5s">
      <mpath href="#toUssuriysk" />
    </animateMotion>
  </circle>
  <circle r="6" fill="#ffdc00">
    <animateMotion dur="6s" repeatCount="indefinite" begin="1s">
      <mpath href="#toDalnegorsk" />
    </animateMotion>
  </circle>
  <circle r="6" fill="#ffdc00">
    <animateMotion dur="6s" repeatCount="indefinite" begin="1.2s">
      <mpath href="#toPartizansk" />
    </animateMotion>
  </circle>
  <circle r="6" fill="#ffdc00">
    <animateMotion dur="7s" repeatCount="indefinite" begin="1.5s">
      <mpath href="#toNakhodka" />
    </animateMotion>
  </circle>
  <circle r="6" fill="#ffdc00">
    <animateMotion dur="10s" repeatCount="indefinite" begin="2s">
      <mpath href="#toKhabarovsk" />
    </animateMotion>
  </circle>

  <!-- DOTS for new branch -->
  <circle r="6" fill="#ffdc00">
    <animateMotion dur="5s" repeatCount="indefinite" begin="0.7s">
      <mpath href="#toBarabash" />
    </animateMotion>
  </circle>
  <circle r="6" fill="#ffdc00">
    <animateMotion dur="6s" repeatCount="indefinite" begin="1.2s">
      <mpath href="#toSlavyanka" />
    </animateMotion>
  </circle>
  <circle r="6" fill="#ffdc00">
    <animateMotion dur="7s" repeatCount="indefinite" begin="1.7s">
      <mpath href="#toAndreevka" />
    </animateMotion>
  </circle>
  <circle r="6" fill="#ffdc00">
    <animateMotion dur="8s" repeatCount="indefinite" begin="2.2s">
      <mpath href="#toHasan" />
    </animateMotion>
  </circle>

  <!-- ===================== -->
  <!-- CITIES -->
  <!-- ===================== -->

  <!-- Владивосток -->
  <g transform="translate(180,400)">
    <circle
      cx="0"
      cy="0"
      r="18"
      fill="#ffdc00"
      stroke="#e6c900"
      stroke-width="3"
      filter="url(#glow)"
    />
    <circle cx="0" cy="0" r="6" fill="#374151" />
    <text
      x="0"
      y="-45"
      text-anchor="middle"
      font-family="Inter, sans-serif"
      font-size="20"
      font-weight="500"
      fill="#1f2937"
    >
      Владивосток
    </text>
  </g>

  <!-- Боковые ветки -->
  <g transform="translate(300,350)">
    <circle cx="0" cy="0" r="10" fill="#ffdc00" stroke="#e6c900" stroke-width="2" />
    <circle cx="0" cy="0" r="3" fill="#374151" />
    <text
      x="0"
      y="-25"
      text-anchor="middle"
      font-family="Inter, sans-serif"
      font-size="16"
      font-weight="400"
      fill="#4b5563"
    >
      Артём
    </text>
  </g>
  <g transform="translate(450,310)">
    <circle cx="0" cy="0" r="10" fill="#ffdc00" stroke="#e6c900" stroke-width="2" />
    <circle cx="0" cy="0" r="3" fill="#374151" />
    <text
      x="0"
      y="-25"
      text-anchor="middle"
      font-family="Inter, sans-serif"
      font-size="16"
      font-weight="400"
      fill="#4b5563"
    >
      Уссурийск
    </text>
  </g>
  <g transform="translate(560,250)">
    <circle cx="0" cy="0" r="10" fill="#ffdc00" stroke="#e6c900" stroke-width="2" />
    <circle cx="0" cy="0" r="3" fill="#374151" />
    <text
      x="0"
      y="-25"
      text-anchor="middle"
      font-family="Inter, sans-serif"
      font-size="16"
      font-weight="400"
      fill="#4b5563"
    >
      Дальнегорск
    </text>
  </g>

  <!-- Города на магистрали -->
  <g transform="translate(600,360)">
    <circle cx="0" cy="20" r="10" fill="#ffdc00" stroke="#e6c900" stroke-width="2" />
    <circle cx="0" cy="20" r="3" fill="#374151" />
    <text
      x="0"
      y="-5"
      text-anchor="middle"
      font-family="Inter, sans-serif"
      font-size="16"
      font-weight="400"
      fill="#4b5563"
    >
      Спасск
    </text>
  </g>
  <g transform="translate(750,400)">
    <circle cx="0" cy="5" r="10" fill="#ffdc00" stroke="#e6c900" stroke-width="2" />
    <circle cx="0" cy="5" r="3" fill="#374151" />
    <text
      x="0"
      y="-20"
      text-anchor="middle"
      font-family="Inter, sans-serif"
      font-size="16"
      font-weight="400"
      fill="#4b5563"
    >
      Лесозаводск
    </text>
  </g>
  <g transform="translate(900,380)">
    <circle cx="0" cy="10" r="10" fill="#ffdc00" stroke="#e6c900" stroke-width="2" />
    <circle cx="0" cy="10" r="3" fill="#374151" />
    <text
      x="0"
      y="-15"
      text-anchor="middle"
      font-family="Inter, sans-serif"
      font-size="16"
      font-weight="400"
      fill="#4b5563"
    >
      Дальнереченск
    </text>
  </g>

  <!-- ✅ Города на новой ветке (названия смещены вправо) -->
  <g transform="translate(200,520)">
    <circle cx="0" cy="0" r="10" fill="#ffdc00" stroke="#e6c900" stroke-width="2" />
    <circle cx="0" cy="0" r="3" fill="#374151" />
    <text
      x="25"
      y="5"
      font-family="Inter, sans-serif"
      font-size="16"
      font-weight="400"
      fill="#4b5563"
    >
      Барабаш
    </text>
  </g>
  <g transform="translate(240,600)">
    <circle cx="0" cy="0" r="10" fill="#ffdc00" stroke="#e6c900" stroke-width="2" />
    <circle cx="0" cy="0" r="3" fill="#374151" />
    <text
      x="25"
      y="5"
      font-family="Inter, sans-serif"
      font-size="16"
      font-weight="400"
      fill="#4b5563"
    >
      Славянка
    </text>
  </g>
  <g transform="translate(280,660)">
    <circle cx="0" cy="0" r="10" fill="#ffdc00" stroke="#e6c900" stroke-width="2" />
    <circle cx="0" cy="0" r="3" fill="#374151" />
    <text
      x="25"
      y="5"
      font-family="Inter, sans-serif"
      font-size="16"
      font-weight="400"
      fill="#4b5563"
    >
      Андреевка
    </text>
  </g>
  <g transform="translate(320,720)">
    <circle cx="0" cy="0" r="10" fill="#ffdc00" stroke="#e6c900" stroke-width="2" />
    <circle cx="0" cy="0" r="3" fill="#374151" />
    <text
      x="25"
      y="5"
      font-family="Inter, sans-serif"
      font-size="16"
      font-weight="400"
      fill="#4b5563"
    >
      Хасан
    </text>
  </g>

  <!-- Партизанск и Находка -->
  <g transform="translate(360,480)">
    <circle cx="0" cy="0" r="10" fill="#ffdc00" stroke="#e6c900" stroke-width="2" />
    <circle cx="0" cy="0" r="3" fill="#374151" />
    <text
      x="0"
      y="-25"
      text-anchor="middle"
      font-family="Inter, sans-serif"
      font-size="16"
      font-weight="400"
      fill="#4b5563"
    >
      Партизанск
    </text>
  </g>
  <g transform="translate(420,520)">
    <circle cx="0" cy="0" r="10" fill="#ffdc00" stroke="#e6c900" stroke-width="2" />
    <circle cx="0" cy="0" r="3" fill="#374151" />
    <text
      x="0"
      y="35"
      text-anchor="middle"
      font-family="Inter, sans-serif"
      font-size="16"
      font-weight="400"
      fill="#4b5563"
    >
      Находка
    </text>
  </g>

  <!-- Хабаровск -->
  <g transform="translate(1000,360)">
    <circle
      cx="0"
      cy="0"
      r="18"
      fill="#ffdc00"
      stroke="#e6c900"
      stroke-width="3"
      filter="url(#glow)"
    />
    <circle cx="0" cy="0" r="6" fill="#374151" />
    <text
      x="0"
      y="-45"
      text-anchor="middle"
      font-family="Inter, sans-serif"
      font-size="20"
      font-weight="500"
      fill="#1f2937"
    >
      Хабаровск
    </text>
  </g>

  <!-- Floating decor -->
  <g opacity="0.1">
    <circle cx="150" cy="200" r="60" fill="#374151" />
    <circle cx="1050" cy="150" r="80" fill="#374151" />
    <circle cx="900" cy="600" r="40" fill="#374151" />
  </g>
</svg>
