@let vm = pageViewModel$ | async;
@let error = error$ | async;

<app-page-layout [showTitle]="false">
  <div class="mx-auto max-w-md">
    <h1 class="font-heading mb-10 text-2xl font-bold lg:text-4xl">
      {{ vm?.content?.title }}
    </h1>

    @if (error) {
      <tui-notification appearance="negative">{{ error.message }}</tui-notification>
    }

    <router-outlet></router-outlet>
  </div>
</app-page-layout>
