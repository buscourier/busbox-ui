@for (project of projects; track project.icon) {
  <div
    class="flex flex-col items-center rounded-2xl bg-white/10 py-8 backdrop-blur-sm transition-all duration-300 hover:bg-white/20"
  >
    <div class="mb-4 inline-block rounded-xl bg-white/20 p-4">
      <tui-icon [icon]="project.icon" [style.font-size.rem]="2.5" />
    </div>
    <h3 class="w-xs text-center text-xl font-semibold">{{ project.description }}</h3>
  </div>
}
