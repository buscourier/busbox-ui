<div class="relative">
  <div
    class="absolute inset-0 -rotate-3 transform rounded-3xl bg-yellow-500/20 bg-gradient-to-br from-yellow-500 to-yellow-400 opacity-60"
  ></div>
  <img
    ngSrc="about-team.jpg"
    ngSrcset="420w, 500w, 690w, 840w, 1035w, 1380w, 1500w, 2070w"
    sizes="(min-width: 1280px) 495px, 100vw"
    alt="Команда Баскурьер"
    width="1000"
    height="1000"
    class="relative h-[350px] w-full transform rounded-2xl object-cover shadow-2xl transition-transform duration-500 hover:scale-105 xl:h-[450px]"
  />
</div>
<div class="max-w-[585px]">
  <h2 class="my-4 text-3xl font-bold text-gray-800 lg:text-4xl">
    Работа в команде
    <span class="text-yellow-500">Баскурьер</span>
  </h2>
  <p class="mb-6 text-lg text-gray-600">
    Мы ищем активных и целеустремленных сотрудников в команду! Наша команда становится крепче когда
    мы:
  </p>
  <div class="mb-6 grid sm:grid-cols-2 md:grid-cols-1 lg:grid-cols-2 lg:gap-2">
    @for (item of activities; track $index) {
      <div
        class="group flex items-center gap-3 rounded-lg p-3 transition-colors hover:bg-yellow-500/10"
      >
        <tui-icon
          [icon]="item.icon"
          class="text-yellow-500 transition-transform duration-200 group-hover:scale-110"
        />

        <span class="font-medium text-gray-900">{{ item.text }}</span>
      </div>
    }
  </div>
  <div class="mt-2">
    <button
      type="button"
      size="l"
      tuiButton
      class="shadow-xs transition-all active:translate-y-[2px] active:shadow-none"
      [routerLink]="careerLink"
    >
      Узнать подробнее
    </button>
  </div>
</div>
