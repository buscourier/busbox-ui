<div class="mb-6">
  @for (item of items.controls; track item.value.preset?.name) {
    <div
      class="mb-6 rounded-md border border-gray-200 bg-white p-4 shadow-sm transition-all"
      [@parcelItem]
    >
      <div class="mb-4 flex items-center justify-between border-b border-gray-100 pb-2">
        <h3 class="text-md flex items-center font-medium text-gray-700">
          <!--          <tui-icon-->
          <!--            icon="@tui.cog"-->
          <!--            class="mr-2"-->
          <!--            [style.color]="'var(&#45;&#45;tui-background-accent-1)'"-->
          <!--            [style.font-size.rem]="1.25"-->
          <!--          />-->
          Запчасть № {{ $index + 1 }}
        </h3>
        @if (items.length > 1) {
          <button
            appearance="secondary-destructive"
            iconStart="@tui.trash"
            size="s"
            tuiIconButton
            type="button"
            [style.border-radius.%]="100"
            (click)="removeItem($index)"
          >
            Favorite
          </button>
        }
      </div>

      <app-auto-part [options]="options" [formControl]="item" />
    </div>
  }

  <div class="mb-4">
    <!--    <tui-error [formControl]="parcelsError" [error]="[] | tuiFieldError | async"></tui-error>-->
  </div>

  <button
    type="button"
    class="flex w-full cursor-pointer items-center justify-center rounded-md border border-dashed border-yellow-300 p-3 text-yellow-600 transition-colors hover:border-yellow-400 hover:bg-yellow-50"
    [disabled]="!canAddItem"
    (click)="addItem()"
  >
    <tui-icon
      icon="@tui.plus"
      class="mr-2"
      [style.color]="'var(--color-yellow-600)'"
      [style.font-size.rem]="1.5"
    />
    <span class="font-medium">Добавить запчасть</span>
  </button>
</div>
