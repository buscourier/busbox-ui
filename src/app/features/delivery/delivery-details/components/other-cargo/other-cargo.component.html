<div class="">
  <div class="grid grid-cols-1 gap-2" [class.md:grid-cols-[3fr_1fr]]="item.value">
    <div tuiLabel class="mb-2">
      <div class="mb-1.5 flex items-center">
        <span class="text-sm text-gray-600">
          {{ 'deliveryDetails.otherCargo.label' | transloco }}
        </span>
      </div>
      <tui-textfield tuiChevron [stringify]="stringify" tuiDropdownMobile="Автозапчасти">
        <input
          tuiSelect
          [formControl]="item"
          [placeholder]="'deliveryDetails.otherCargo.placeholder' | transloco"
        />

        <tui-data-list-wrapper *tuiTextfieldDropdown new [items]="options | tuiFilterByInput" />
      </tui-textfield>
    </div>

    @if (item.value) {
      <div tuiLabel>
        <div class="mb-1.5 flex items-center">
          <span class="text-sm text-gray-600">
            {{ 'deliveryDetails.fields.quantity' | transloco }}
          </span>
        </div>
        <tui-textfield>
          <input
            tuiInputNumber
            placeholder="0"
            [formControl]="quantity"
            (blur)="setMinQuantityOnBlur()"
            [step]="1"
          />
        </tui-textfield>
      </div>
    }
  </div>
</div>
