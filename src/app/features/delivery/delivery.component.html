@let isMainLayout = isMainLayout$ | async;

<app-page-layout
  [showTitle]="!isBookingPage"
  [showDescription]="!isBookingPage"
  [class]="getPageClasses()"
>
  <div class="lg:flex lg:basis-1/2 lg:gap-12">
    <div class="grow">
      <router-outlet />
    </div>
    @if (isMainLayout) {
      <aside class="w-full max-w-[400px] min-w-96 shrink-0">
        <app-delivery-summary></app-delivery-summary>
      </aside>
    }
  </div>
</app-page-layout>
