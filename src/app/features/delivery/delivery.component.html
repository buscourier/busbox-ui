@let isMainLayout = isMainLayout$ | async;

<app-page-layout [showTitle]="!isBookingPage" [showDescription]="!isBookingPage">
  <div class="lg:flex lg:basis-1/2 lg:gap-16">
    <main class="grow">
      <router-outlet />
    </main>
    @if (isMainLayout) {
      <aside class="min-w-96 grow basis-1/3 lg:basis-1/2 xl:basis-1/3">
        <app-delivery-summary></app-delivery-summary>
      </aside>
    }
  </div>
</app-page-layout>
