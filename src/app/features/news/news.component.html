@let vm = vm$ | async;

<app-page-layout>
  @if (vm) {
    <div class="grid grid-cols-1 gap-8 md:grid-cols-2 lg:grid-cols-3">
      @for (article of vm.list.data; track article.news_id) {
        <app-news-card [article]="article" />
      } @empty {
        <div class="h-[393px] w-[395px] rounded-xl bg-black/5"></div>
        <div class="h-[393px] w-[395px] rounded-xl bg-black/5"></div>
        <div class="h-[393px] w-[395px] rounded-xl bg-black/10"></div>
        <div class="h-[393px] w-[395px] rounded-xl bg-black/10"></div>
        <div class="h-[393px] w-[395px] rounded-xl bg-black/10"></div>
        <div class="h-[393px] w-[395px] rounded-xl bg-black/10"></div>
      }
    </div>
  }
</app-page-layout>
