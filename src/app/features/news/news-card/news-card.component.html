<div class="relative">
  <img
    [src]="article.image"
    [alt]="article.title"
    [tuiSkeleton]="!imageLoaded"
    (load)="onImageLoad()"
    (error)="onImageError()"
    class="w-full h-48 object-cover"
  />
  <!--  <div class="absolute top-4 left-4">-->
  <!--            <span class="bg-yellow-500 text-white px-3 py-1 rounded-full text-sm font-medium">-->
  <!--                Акция-->
  <!--            </span>-->
  <!--  </div>-->
</div>
<div class="p-6">
  <h3 class="font-bold text-xl text-gray-900 mb-3 line-clamp-2" [tuiSkeleton]="!imageLoaded">
    {{ article.title }}
  </h3>
  <p class="text-gray-600 text-sm mb-4 line-clamp-3" [tuiSkeleton]="!imageLoaded">
    Предъявите студенческий билет и получите скидку на отправку посылок. Акция действует до конца
    учебного года.
  </p>

  <a
    [routerLink]="['/news', article.id]"
    class="inline-flex items-center text-black hover:text-yellow-500 font-medium text-sm transition-colors"
    [tuiSkeleton]="!imageLoaded"
  >
    Читать далее
    <tui-icon icon="@tui.chevron-right" [style.font-size.rem]="0.8" class="ml-0.5" />
  </a>
</div>
